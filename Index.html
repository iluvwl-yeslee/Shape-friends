<!doctype html>
<html lang="ko" class="lay-tablet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도형 친구들 K1~K4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#DDF0FF;--dot:#BCDDF6;--ink:#1D2B53;--sun:#FFD23F;--grass:#3BB273;--sky:#5CC8FF;--coral:#FF5A5F;--soft:#F2F8FF;--okbg:#CFF5DE;--nobg:#FFD9DA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Gowun Dodum','Jua',sans-serif;color:var(--ink);background:var(--bg) radial-gradient(var(--dot) 2px,transparent 2px) 0 0/22px 22px;min-height:100vh;font-size:18px;user-select:none;-webkit-user-select:none}
h1,h2,h3,.jua,.btn,.chip,.opt,.big{font-family:'Jua',sans-serif;font-weight:400}
h1{font-size:34px;margin:6px 0}h2{font-size:26px;margin:6px 0}h3{margin:6px 0}
#app{max-width:1000px;margin:0 auto;padding:18px 18px 60px}
html.lay-mobile #app{max-width:440px;padding:12px 12px 50px}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--ink);margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.c{justify-content:center}.row.sb{justify-content:space-between}
.btn{display:inline-block;padding:12px 24px;border-radius:18px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);font-size:22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.green{background:var(--grass);color:#fff}.btn.white{background:#fff}.btn.sky{background:var(--sky)}.btn.small{padding:6px 14px;font-size:16px;box-shadow:0 3px 0 var(--ink)}.btn.big{font-size:28px;padding:16px 34px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}.dot.cur{background:var(--sun);transform:scale(1.25)}.dot.ok{background:var(--grass)}.dot.no{background:var(--coral)}
.chip{display:inline-block;background:var(--sky);border:2px solid var(--ink);border-radius:14px;padding:2px 12px;font-size:15px}.chip.warn{background:#FFE0A3}
.qtext{font-family:'Jua';font-size:26px;margin:8px 0}
html.lay-mobile .qtext{font-size:22px}
.say{border:2px solid var(--ink);background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.stage{background:var(--soft);border:3px dashed var(--dot);border-radius:18px;padding:10px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.opt{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px;min-width:64px;font-size:26px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.opt.sel{background:#FFF3B8;transform:translateY(-3px);border-color:#E89F00}
.opt.good{background:var(--okbg);border-color:var(--grass)}.opt.bad{background:var(--nobg);border-color:var(--coral)}
.opt svg{display:block}
.grid{width:210px;height:210px;background:#fff;border-radius:14px;border:2px solid var(--dot)}
html.lay-mobile .grid{width:44vw;max-width:170px;height:auto}
.scene{width:320px;height:320px;max-width:100%;background:#fff;border-radius:14px;border:2px solid var(--dot)}
html.lay-mobile .scene{width:100%;height:auto}
.scat{width:420px;max-width:100%;background:#fff;border-radius:14px;border:2px solid var(--dot)}
html.lay-mobile .scat{width:100%}
.papers{width:240px;height:240px;max-width:100%}
.bins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.bin{flex:1;min-width:92px;min-height:110px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px;text-align:center;cursor:pointer}
.bin .bl{font-family:'Jua';font-size:22px}.bin .cont{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:44px}
.cell{cursor:pointer;border-radius:12px;padding:2px;border:3px solid transparent}.cell.sel{border-color:#E89F00;background:#FFF3B8}.cell.bad{border-color:var(--coral);background:var(--nobg)}.cell.good{border-color:var(--grass);background:var(--okbg)}
.fb{border:3px solid var(--ink);border-radius:18px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb .m{flex:none}.fb .big{font-size:24px}
.step{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 8px}
.step b{font-family:'Jua';font-size:28px;min-width:30px;text-align:center;font-weight:400}
.step button{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:24px;font-family:'Jua';cursor:pointer}
.world{display:grid;grid-template-columns:90px repeat(5,1fr);gap:8px;align-items:center}
html.lay-mobile .world{grid-template-columns:62px repeat(5,1fr);gap:5px}
.wd{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:18px}
.wd.ok{background:var(--grass);color:#fff}.wd.cur{background:var(--sun);transform:scale(1.15);animation:bob 1s infinite alternate}
@keyframes bob{to{transform:scale(1.28)}}
.lock{opacity:.55}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dayb{font-family:'Jua';font-size:24px;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px 0;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.dayb small{display:block;font-size:12px;min-height:14px}.dayb.ok{background:var(--okbg)}
.dayb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cubes,.cg{display:block}
.tgsvg{width:420px;max-width:100%;height:auto;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage:has(.tgsvg){touch-action:none}
.pc{cursor:grab}.pc polygon{stroke:#1D2B53;stroke-width:.08;stroke-linejoin:round}
.laysw{position:fixed;right:8px;bottom:8px;z-index:5;font-size:14px}
.pbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
html.lay-mobile .book{grid-template-columns:repeat(3,1fr);gap:8px}
.stk{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px;text-align:center;position:relative}
.stk img{width:100%;aspect-ratio:1;display:block;border-radius:10px}
.stk.rare{border-color:#E89F00;box-shadow:0 0 0 3px #FFE27A,0 0 14px #FFD23F}
.stk.empty{opacity:.4;display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:34px}
.rv{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px}
.reveal{width:230px;height:300px;perspective:900px;position:relative;margin:12px auto}
.flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.flip.spin{animation:cs 1.9s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes cs{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(540deg) scale(1.2)}100%{transform:rotateY(900deg) scale(1)}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;box-shadow:0 6px 0 var(--ink)}
.face.front{background:repeating-linear-gradient(45deg,#5CC8FF,#5CC8FF 14px,#8FDAFF 14px,#8FDAFF 28px);font-size:80px;color:#fff}
.face.back{transform:rotateY(180deg)}
.face.back img{width:100%;border-radius:14px;background:var(--soft)}
.aura{position:absolute;inset:-18px;border-radius:34px;background:conic-gradient(#FFD23F,#FF7EB6,#5CC8FF,#3BB273,#FFD23F);filter:blur(14px);opacity:0;z-index:-1;transition:opacity .5s}
.aura.on{opacity:.85;animation:rot 4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.spk{position:absolute;font-size:26px;pointer-events:none;opacity:0}
.spk.burst{animation:burst 1.3s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.3)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(200deg)}}
.late{opacity:0;animation:fin .5s 2s forwards}
@keyframes fin{to{opacity:1}}
.mas{animation:hop 2.4s infinite}
@keyframes hop{0%,90%,100%{transform:translateY(0)}95%{transform:translateY(-8px)}}
.small{font-size:14px;opacity:.8}
input[type=text]{font-family:'Jua';font-size:24px;border:3px solid var(--ink);border-radius:14px;padding:10px;width:100%}
select{font-family:'Jua';font-size:18px;padding:6px;border:3px solid var(--ink);border-radius:10px}
.hist{max-height:200px;overflow:auto;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<button class="btn small white laysw" id="laysw"></button>
<script>
/* ===== utils ===== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mkRng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RR=r=>({r,int:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)],shuf:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}});
const COL={red:'#FF5A5F',blue:'#4D96FF',yellow:'#FFD23F',green:'#3BB273',purple:'#A78BFA',orange:'#FF9F43',pink:'#FF7EB6'};
const CKEYS=Object.keys(COL);
const CNAME={red:'빨간',blue:'파란',yellow:'노란',green:'초록',purple:'보라',orange:'주황',pink:'분홍'};
const TN={sq:'네모',tri:'세모',cir:'동그라미'},TS={sq:'□',tri:'△',cir:'○'},TYPES=['sq','tri','cir'];
const INK='#1D2B53';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ===== storage ===== */
let DB;try{DB=JSON.parse(localStorage.getItem('shp1'))}catch(e){}
DB=DB||{profiles:{},cur:null,lay:innerWidth<700?'mobile':'tablet',tts:true};
const save=()=>{try{localStorage.setItem('shp1',JSON.stringify(DB))}catch(e){}};
const P=()=>DB.profiles[DB.cur];

/* ===== svg shapes ===== */
function inner(t,fill,extra=''){
  const a=`fill="${fill}" stroke="${INK}" stroke-width="5" stroke-linejoin="round" ${extra}`;
  if(t==='sq')return`<rect x="14" y="14" width="72" height="72" rx="6" ${a}/>`;
  if(t==='tri')return`<polygon points="50,10 92,86 8,86" ${a}/>`;
  return`<circle cx="50" cy="50" r="39" ${a}/>`;
}
const shp=(t,c,s=56,rot=0)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><g transform="rotate(${rot} 50 50)">${inner(t,c)}</g></svg>`;
function mascot(kind,mood='happy',size=80){
  const fill={sq:'#4D96FF',tri:'#FFD23F',cir:'#FF7EB6'}[kind]||'#4D96FF';
  const cy=kind==='tri'?62:50;
  const mouth=mood==='sad'?`M40 ${cy+14} Q50 ${cy+6} 60 ${cy+14}`:`M40 ${cy+8} Q50 ${cy+20} 60 ${cy+8}`;
  return`<svg width="${size}" height="${size}" viewBox="0 0 100 100" class="mas">${inner(kind,fill)}<circle cx="38" cy="${cy-4}" r="4.5" fill="${INK}"/><circle cx="62" cy="${cy-4}" r="4.5" fill="${INK}"/><circle cx="31" cy="${cy+6}" r="4.5" fill="#FF9AA2" opacity=".7"/><circle cx="69" cy="${cy+6}" r="4.5" fill="#FF9AA2" opacity=".7"/><path d="${mouth}" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
}
const MNAME={sq:'네모',tri:'세모',cir:'동글이'};
/* pictures with attributes */
const ATTR={house:{roof:'c',win:'c'},tree:{fruit:'c',n:'n'},kid:{flag:'c',shirt:'c'},fish:{body:'c',tail:'c'}};
const ANAME={roof:'지붕 색',win:'창문 색',fruit:'열매 색',n:'열매 수',flag:'깃발 색',shirt:'옷 색',body:'몸 색',tail:'꼬리 색'};
function pic(kind,a,s=100){
  const st=`stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  let b='';
  if(kind==='house')b=`<rect x="20" y="46" width="60" height="44" fill="#FFE8B0" ${st}/><polygon points="12,48 50,12 88,48" fill="${COL[a.roof]}" ${st}/><rect x="40" y="60" width="20" height="22" fill="${COL[a.win]}" ${st}/>`;
  if(kind==='tree'){const f=[[38,30],[62,34],[46,52],[64,54]].slice(0,a.n).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${COL[a.fruit]}" ${st}/>`).join('');b=`<rect x="44" y="62" width="12" height="28" fill="#B07A4A" ${st}/><circle cx="50" cy="40" r="30" fill="#8EDB9B" ${st}/>${f}`}
  if(kind==='kid')b=`<line x1="72" y1="46" x2="72" y2="10" stroke="${INK}" stroke-width="4"/><polygon points="72,10 94,18 72,26" fill="${COL[a.flag]}" ${st}/><circle cx="46" cy="26" r="15" fill="#FFD9B0" ${st}/><rect x="30" y="42" width="32" height="30" rx="6" fill="${COL[a.shirt]}" ${st}/><rect x="34" y="72" width="9" height="18" fill="#556" ${st}/><rect x="49" y="72" width="9" height="18" fill="#556" ${st}/>`;
  if(kind==='fish')b=`<ellipse cx="42" cy="50" rx="30" ry="20" fill="${COL[a.body]}" ${st}/><polygon points="68,50 94,30 94,70" fill="${COL[a.tail]}" ${st}/><circle cx="30" cy="44" r="4" fill="${INK}"/>`;
  return`<svg width="${s}" height="${s}" viewBox="0 0 100 100">${b}</svg>`;
}
const rv=(R,k,not)=>{let v,g=0;do{v=ATTR_T(k)==='n'?R.pick([1,2,3,4]):R.pick(CKEYS)}while(v===not&&g++<50);return v};
const ATTR_T=k=>k==='n'?'n':'c';

/* grid helpers */
const gGeo=n=>{const st=n<=3?60:46,pad=26;return{st,pad,size:pad*2+(n-1)*st}};
const nXY=(n,i)=>{const g=gGeo(n);return[g.pad+(i%n)*g.st,g.pad+Math.floor(i/n)*g.st]};
function mkEdges(n){const E=[];for(let r=0;r<n;r++)for(let c=0;c<n-1;c++)E.push([r*n+c,r*n+c+1]);for(let r=0;r<n-1;r++)for(let c=0;c<n;c++)E.push([r*n+c,(r+1)*n+c]);return E}
function gridSVG(n,on,o={}){
  const E=mkEdges(n),g=gGeo(n);let s=`<svg viewBox="0 0 ${g.size} ${g.size}" class="grid">`,hit='';
  E.forEach((e,i)=>{const[x1,y1]=nXY(n,e[0]),[x2,y2]=nXY(n,e[1]);const isOn=on.includes(i);let col=isOn?'#4D96FF':null,dash='';
    if(o.rev){const t=o.target.includes(i);if(isOn&&!t)col='#FF5A5F';if(!isOn&&t){col='#3BB273';dash='stroke-dasharray="7 7"'}}
    if(col)s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="9" stroke-linecap="round" ${dash}/>`;
    if(o.hit)hit+=`<line data-act="tap" data-v="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(0,0,0,0.001)" stroke-width="${g.st*0.6}" stroke-linecap="round" style="cursor:pointer"/>`;});
  for(let i=0;i<n*n;i++){const[x,y]=nXY(n,i);s+=`<circle cx="${x}" cy="${y}" r="6" fill="${INK}"/>`}
  return s+hit+'</svg>';
}
function randPath(R,n,k){
  const E=mkEdges(n);
  for(let tries=0;tries<200;tries++){
    let node=R.int(0,n*n-1);const used=[];
    while(used.length<k){const c=E.map((e,i)=>({e,i})).filter(x=>!used.includes(x.i)&&(x.e[0]===node||x.e[1]===node));if(!c.length)break;const p=R.pick(c);used.push(p.i);node=p.e[0]===node?p.e[1]:p.e[0]}
    if(used.length===k)return used;
  }
  return[0,1,2].slice(0,k);
}
/* scatter */
function scatter(R,counts,colorMode){
  const cells=[];for(let r=0;r<3;r++)for(let c=0;c<6;c++)cells.push([c,r]);
  const list=[];TYPES.forEach(t=>{for(let i=0;i<(counts[t]||0);i++)list.push({t})});
  const pos=R.shuf(cells);
  return R.shuf(list).map((o,i)=>({t:o.t,c:colorMode?R.pick(CKEYS):{sq:COL.blue,tri:COL.yellow,cir:COL.pink}[o.t],x:pos[i][0]*50+7+R.int(-4,4),y:pos[i][1]*50+7+R.int(-4,4),rot:R.int(-20,20)})).map(o=>(o.c=COL[o.c]||o.c,o));
}
function scatSVG(list,mark){
  let n=0,s='<svg viewBox="0 0 300 150" class="scat">';
  list.forEach(o=>{s+=`<svg x="${o.x}" y="${o.y}" width="36" height="36" viewBox="0 0 100 100"><g transform="rotate(${o.rot} 50 50)">${inner(o.t,o.c)}</g></svg>`;
    if(mark&&o.t===mark){n++;s+=`<circle cx="${o.x+18}" cy="${o.y+20}" r="10" fill="#fff" stroke="#FF5A5F" stroke-width="2"/><text x="${o.x+18}" y="${o.y+25}" text-anchor="middle" font-size="14" font-weight="bold" fill="#FF5A5F">${n}</text>`}});
  return s+'</svg>';
}
const cnt=(list,t)=>list.filter(o=>o.t===t).length;
const optCls=(sel,i,ans,rev)=>(rev&&i===ans?'good':rev&&sel===i&&sel!==ans?'bad':(sel===i?'sel':''));

/* ===== problem types ===== */
const T={};
T.same={cat:'1주 · 같은 모양',say:'똑같은 그림을 찾아 눌러요.',q:'똑같은 그림을 찾아요',
  gen(R,l){const kind=R.pick(Object.keys(ATTR)),keys=Object.keys(ATTR[kind]),base={};keys.forEach(k=>base[k]=rv(R,k));
    const n=l<=2?3:4,opts=[{...base}],seen=new Set([JSON.stringify(base)]);let g=0;
    while(opts.length<n&&g++<300){const o={...base};(l<=2?keys:[R.pick(keys)]).forEach(k=>o[k]=rv(R,k,base[k]));const s=JSON.stringify(o);if(!seen.has(s)){seen.add(s);opts.push(o)}}
    const sh=R.shuf(opts.map((o,i)=>({o,c:i===0})));return{kind,base,opts:sh.map(x=>x.o),ans:sh.findIndex(x=>x.c),st:{sel:null}}},
  view(it,rev){return`<div class="stage">${pic(it.kind,it.base,120)}</div><div class="opts">${it.opts.map((o,i)=>`<button class="opt ${optCls(it.st.sel,i,it.ans,rev)}" data-act="tap" data-v="${i}">${pic(it.kind,o,92)}</button>`).join('')}</div>`},
  tap(it,v){it.st.sel=+v},can:it=>it.st.sel!=null,ok:it=>it.st.sel===it.ans,
  exp(it){const o=it.opts[it.st.sel],d=Object.keys(o).filter(k=>o[k]!==it.base[k]).map(k=>ANAME[k]);return`내가 고른 그림은 ${d.join('과 ')}이 달라요. 초록 테두리 그림이 똑같아요!`}};

T.copy={cat:'1주 · 따라 그리기',say:'왼쪽 모양과 똑같이 선을 이어 보세요.',q:'똑같이 선을 이어요',
  gen(R,l){const n=l===3?4:3,k=l===1?R.int(3,4):l===2?R.int(5,6):R.int(6,7);return{n,target:randPath(R,n,k),st:{on:[]}}},
  view(it,rev){return`<div class="stage"><div>${gridSVG(it.n,it.target)}<div class="small" style="text-align:center">이렇게!</div></div><div>${gridSVG(it.n,it.st.on,{hit:!rev,rev,target:it.target})}<div class="small" style="text-align:center">여기에 그려요</div></div></div>`},
  tap(it,v){v=+v;const a=it.st.on,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)},
  can:it=>it.st.on.length>0,ok:it=>it.st.on.length===it.target.length&&it.target.every(x=>it.st.on.includes(x)),

const slots=(R,n)=>{const c=[];for(let r=0;r<3;r++)for(let q=0;q<6;q++)c.push([q*50+5+R.int(-3,3),r*50+5+R.int(-3,3)]);return R.shuf(c).slice(0,n)};

T.sSame={cat:'1주 · 입체 모양 알기',say:'위의 모양과 같은 모양을 찾아요.',q:'위의 모양과 같은 모양을 찾아요',...selT,
  gen(R,l){const t=R.pick(SK),ks=R.shuf(SK),tc=R.pick(PAL);return{t,tc,opts:ks.map(k=>({k,c:R.pick(PAL.filter(x=>x!==tc))})),ans:ks.indexOf(t),st:{sel:null}}},
  view(it,rev){return`<div class="stage">${sol(it.t,it.tc,120)}</div><div class="opts">${it.opts.map((o,i)=>`<button class="opt ${optCls(it.st.sel,i,it.ans,rev)}" data-act="tap" data-v="${i}">${sol(o.k,o.c,90)}</button>`).join('')}</div>`},

T.sOdd={cat:'1주 · 다른 모양 찾기',say:'모양이 다른 하나를 찾아요.',q:'모양이 다른 하나를 찾아요',...selT,
  gen(R,l){const a=R.pick(SK),b=R.pick(SK.filter(x=>x!==a)),n=l===1?4:5,odd=R.int(0,n-1);return{a,b,ans:odd,items:Array.from({length:n},(_,i)=>({k:i===odd?b:a,c:R.pick(PAL)})),st:{sel:null}}},
  view(it,rev){return`<div class="opts">${it.items.map((o,i)=>`<button class="opt ${optCls(it.st.sel,i,it.ans,rev)}" data-act="tap" data-v="${i}">${sol(o.k,o.c,76)}</button>`).join('')}</div>`},
  exp:it=>`나머지는 모두 ${SN[it.a]} 모양인데 이것만 ${SN[it.b]} 모양이에요.`};
function makeSort(cat,keys,lab,draw,pool,hint){return{cat,say:'눌러서 알맞은 칸에 넣어요.',q:'같은 모양끼리 모아요',
  gen(R,l){const n=l===1?5:l===2?6:8;let ts;do{ts=Array.from({length:n},()=>R.pick(keys))}while(keys.some(t=>!ts.includes(t)));return{items:ts.map(t=>({t,v:R.pick(pool?pool[t]:PAL)})),st:{asg:Array(n).fill(null),sel:null}}},
  view(it,rev){const{asg,sel}=it.st;
    const tray=it.items.map((o,i)=>asg[i]?'':`<div class="cell ${sel===i?'sel':''}" data-act="tap" data-v="s${i}">${draw(o,54)}</div>`).join('');
    const bins=keys.map(t=>`<div class="bin" data-act="tap" data-v="b${t}"><div class="bl">${lab[t]}</div><div class="cont">${it.items.map((o,i)=>asg[i]===t?`<div class="cell ${rev?(o.t===t?'good':'bad'):''}" data-act="tap" data-v="u${i}">${draw(o,40)}</div>`:'').join('')}</div></div>`).join('');
    return`<div class="stage">${tray||'<span class="jua">모두 넣었어요!</span>'}</div><div class="bins">${bins}</div>`},
  tap(it,v){const s=it.st;if(v[0]==='s')s.sel=s.sel===+v.slice(1)?null:+v.slice(1);else if(v[0]==='b'){if(s.sel!=null){s.asg[s.sel]=v.slice(1);s.sel=null}}else if(v[0]==='u')s.asg[+v.slice(1)]=null},
  can:it=>it.st.asg.every(Boolean),ok:it=>it.items.every((o,i)=>it.st.asg[i]===o.t),
  exp:it=>`잘못 들어간 것이 ${it.items.filter((o,i)=>it.st.asg[i]!==o.t).length}개 있어요(빨간 테두리). ${hint}`}}

T.oSort=makeSort('2주 · 물건 분류',SK,{box:'📦 상자',can:'🥫 통',ball:'⚽ 공'},(o,s)=>`<span style="font-size:${s*.8}px;line-height:1.1;display:block">${o.v}</span>`,OBJ,'생활 속 물건도 상자·통·공 모양으로 나눌 수 있어요.');
function solScat(R,counts){const list=[];SK.forEach(k=>{for(let i=0;i<counts[k];i++)list.push({k,c:R.pick(PAL)})});const L=R.shuf(list),p=slots(R,L.length);return L.map((o,i)=>({...o,x:p[i][0],y:p[i][1]}))}
function solScatSVG(list,sel,rev,tk,tap){let s='<svg viewBox="0 0 300 150" class="scat">';
  list.forEach((o,i)=>{const on=sel&&sel.includes(i),t=o.k===tk;
    if(tap){if(on)s+=`<rect x="${o.x-2}" y="${o.y-2}" width="44" height="44" rx="8" fill="#FFF3B8" stroke="${rev&&!t?'#FF5A5F':'#E89F00'}" stroke-width="3"/>`;else if(rev&&t)s+=`<rect x="${o.x-2}" y="${o.y-2}" width="44" height="44" rx="8" fill="none" stroke="#3BB273" stroke-width="3" stroke-dasharray="5 4"/>`}
    s+=`<svg x="${o.x}" y="${o.y}" width="40" height="40" viewBox="0 0 100 100">${sol(o.k,o.c,100).replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`;
    if(tap)s+=`<rect x="${o.x}" y="${o.y}" width="40" height="40" fill="rgba(0,0,0,.001)" data-act="tap" data-v="${i}" style="cursor:pointer"/>`});
  return s+'</svg>'}
T.sPick={cat:'1주 · 모양 찾아 칠하기',say:null,

 snow:{n:'눈사람 마을',p:[['ball',110,100,80],['ball',122,46,56],['can',128,6,44],['box',30,140,50],['box',220,140,50]]},

  ...selT,exp:it=>`${SN[it.t]} 모양은 ${it.ans}개예요. 빨간 점선을 따라 세어 보세요. (상자 ${it.cnt.box||0}, 통 ${it.cnt.can||0}, 공 ${it.cnt.ball||0})`};

const LKC=['#FF5A5F','#4D96FF','#3BB273'];
T.link={cat:'2주 · 선 잇기',say:'같은 모양끼리 짝을 지어 주세요. 왼쪽을 누르고 오른쪽을 눌러요.',q:'같은 모양끼리 이어요 (왼쪽 → 오른쪽)',
  gen(R,l){const left=R.shuf(SK),right=R.shuf(SK).map(k=>({k,e:R.pick(OBJ[k])}));return{left,right,lc:left.map(()=>R.pick(PAL)),st:{sel:null,map:{}}}},
  view(it,rev){const m=it.st.map,okOf=i=>it.right[m[i]]&&it.right[m[i]].k===it.left[i];
    const L=it.left.map((k,i)=>`<button class="opt ${it.st.sel===i?'sel':''} ${rev&&m[i]!=null?(okOf(i)?'good':'bad'):''}" style="${m[i]!=null&&!rev?`border-color:${LKC[i]};border-width:7px`:''}" data-act="tap" data-v="l${i}">${sol(k,it.lc[i],70)}</button>`).join('');
    const R_=it.right.map((o,j)=>{const li=Object.keys(m).find(i=>m[i]===j);return`<button class="opt" style="${li!=null?`border-color:${LKC[li]};border-width:7px`:''}" data-act="tap" data-v="r${j}"><span style="font-size:48px;line-height:1.1">${o.e}</span></button>`}).join('');
    return`<div class="stage" style="justify-content:space-around;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:10px">${L}</div><div style="align-self:center;font-size:30px">➜</div><div style="display:flex;flex-direction:column;gap:10px">${R_}</div></div>`},
  tap(it,v){const s=it.st;if(v[0]==='l'){const i=+v.slice(1);if(s.map[i]!=null)delete s.map[i];s.sel=i}else if(s.sel!=null){const j=+v.slice(1);Object.keys(s.map).forEach(i=>{if(s.map[i]===j)delete s.map[i]});s.map[s.sel]=j;s.sel=null}},
  can:it=>Object.keys(it.st.map).length===3,ok:it=>it.left.every((k,i)=>it.right[it.st.map[i]]&&it.right[it.st.map[i]].k===k),
  exp:()=>'상자 모양은 📦처럼 각진 물건, 통 모양은 🥫처럼 둥근 기둥, 공 모양은 ⚽처럼 동그란 물건이에요.'};

T.cubeCount={cat:'3주 · 쌓기나무',say:null,q:'쌓기나무는 모두 몇 개일까요?',
  gen(R,l){const n=l===1?R.int(2,3):l===2?3:4,mx=l===1?2:l===2?3:4;let hs;do{hs=Array.from({length:n},()=>R.int(1,mx))}while(hs.reduce((a,b)=>a+b,0)>12||(l>1&&hs.every(h=>h===hs[0])));return{hs,ans:hs.reduce((a,b)=>a+b,0),c:R.pick(PAL),st:{sel:null}}},
  view(it,rev){return`<div class="stage">${cubesSVG(colsList(it.hs),it.c,1.4)}</div>`+numBtns(it,rev,NUM12)},...selT,
  exp:it=>`줄마다 세어 더해 보세요: ${it.hs.join(' + ')} = ${it.ans}개예요.`};
T.cubeCmp={cat:'3주 · 쌓기나무 비교',say:null,q:'쌓기나무가 더 많은 쪽은 어디일까요?',
  gen(R,l){let a,b,sa,sb;do{const n=l===1?2:3;a=Array.from({length:n},()=>R.int(1,l===1?2:3));b=Array.from({length:n},()=>R.int(1,l===1?2:3));sa=a.reduce((x,y)=>x+y,0);sb=b.reduce((x,y)=>x+y,0)}while(l<3?sa===sb:false);
    return{a,b,sa,sb,ca:R.pick(PAL),cb:R.pick(PAL),ans:sa>sb?'A':sa<sb?'B':'E',st:{sel:null}}},
  view(it,rev){const opt=(k,t)=>`<button class="opt ${optCls(it.st.sel,k,it.ans,rev)}" data-act="tap" data-v="${k}">${t}</button>`;
    return`<div class="stage"><div style="text-align:center"><div class="jua">가</div>${cubesSVG(colsList(it.a),it.ca,1)}</div><div style="text-align:center"><div class="jua">나</div>${cubesSVG(colsList(it.b),it.cb,1)}</div></div><div class="opts">${opt('A','가')}${opt('B','나')}${it.sa===it.sb?opt('E','같아요'):''}</div>`},...selT,
  exp:it=>`가는 ${it.sa}개, 나는 ${it.sb}개예요.`};

T.topView={cat:'4주 · 새가 보는 모양',say:'새가 하늘에서 내려다보면 어떤 모양일까요?',q:'새가 하늘에서 내려다보면 어떤 모양일까요?',
  gen(R,l){const W=l===2?4:3,H=l===3?3:2,n=l===1?R.int(3,4):l===2?R.int(4,6):R.int(5,6),F=randPoly(R,n,W,H),key=cs=>cs.map(c=>c.join(',')).sort().join(';');
    const opts=[F],seen=new Set([key(F)]),cand=[F.map(([x,y])=>[W-1-x,y]),F.map(([x,y])=>[x,H-1-y])];
    for(let t=0;t<40;t++){const i=R.int(0,F.length-1);for(const[dx,dy]of R.shuf([[1,0],[-1,0],[0,1],[0,-1]])){const nx=F[i][0]+dx,ny=F[i][1]+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H&&!has(F,nx,ny)){cand.push(F.map((c,j)=>j===i?[nx,ny]:c));break}}}
    R.shuf(cand).forEach(c=>{if(opts.length<3&&!seen.has(key(c))){seen.add(key(c));opts.push(c)}});
    for(let t=0;opts.length<3&&t<200;t++){const c=randPoly(R,n,W,H);if(!seen.has(key(c))){seen.add(key(c));opts.push(c)}}
    const sh=R.shuf(opts.map((c,i)=>({c,ok:i===0})));return{W,H,F,c:R.pick(PAL),opts:sh.map(x=>x.c),ans:sh.findIndex(x=>x.ok),st:{sel:null}}},
  view(it,rev){const{W,H}=it;const top=cs=>gridCells(W,H,(x,r)=>has(cs,x,H-1-r)?{fill:FILLC}:{fill:'#fff',stroke:'#BCDDF6',sw:1.5},30);
    return`<div class="stage">${cubesSVG(it.F.map(([x,y])=>[x,y,0]),it.c,1.3)}</div><div class="opts">${it.opts.map((cs,i)=>`<button class="opt ${optCls(it.st.sel,i,it.ans,rev)}" data-act="tap" data-v="${i}">${top(cs)}</button>`).join('')}</div>`},...selT,
  exp:()=>'위에서 내려다보면 쌓기나무의 윗면만 보여요. 앞쪽은 아래, 뒤쪽은 위에 그려져요.'};

T.mirror={cat:'1주 · 거울 색칠',say:'가운데 선이 거울이에요. 거울에 비친 모양처럼 오른쪽을 색칠해요.',q:'거울에 비친 것처럼 오른쪽을 색칠해요',
  gen(R,l){const m=l===3?3:2,rows=l===1?3:4,left=[];for(let y=0;y<rows;y++)for(let x=0;x<m;x++)if(R.r()<.5)left.push([x,y]);if(left.length<2){left.push([0,0],[m-1,rows-1])}
    const uniq=[];left.forEach(c=>{if(!has(uniq,c[0],c[1]))uniq.push(c)});
    const target=uniq.map(([x,y])=>y*2*m+(2*m-1-x));return{m,rows,left:uniq,target,st:{on:[]}}},
  view(it,rev){const{m,rows,left}=it,w=2*m,mid=4+m*34;
    const g=gridCells(w,rows,(x,y)=>{const i=y*w+x;if(x<m)return{fill:has(left,x,y)?FILLC:'#fff'};const on=it.st.on.includes(i),t=it.target.includes(i);
      if(rev){if(t&&!on)return{fill:'#BFEFD0',dash:1,stroke:'#3BB273'};if(on&&!t)return{fill:FILLC,stroke:'#FF5A5F',sw:4}}
      return{fill:on?FILLC:'#fff',act:i,stroke:on?INK:'#7FA2CC',dash:!on}},34,`<line x1="${mid}" y1="0" x2="${mid}" y2="${rows*34+8}" stroke="#FF5A5F" stroke-width="4" stroke-dasharray="7 5"/>`);
    return`<div class="stage">${g}</div>`},
  tap:(it,v)=>toggleT(it,v),can:it=>it.st.on.length>0,ok:it=>sameSet(it.st.on,it.target),
  exp:()=>'가운데 선을 접으면 왼쪽과 오른쪽이 딱 겹쳐야 해요. 초록 점선이 빠진 칸이에요.'};
function makeFill(cat,k,say){return{cat,say,q:`빈 곳에 꼭 맞는 조각을 찾아요`,
  gen(R,l){const W=k===3?3:4,H=3,hole=randPoly(R,k,W,H),piece=normC(hole),pk=keyOf(piece),opts=[piece],seen=new Set([pk]);
    let p=piece;for(let r=0;r<3;r++){p=rot90(p);if(!seen.has(keyOf(p))&&opts.length<3&&R.r()<(l>1?.9:.4)){seen.add(keyOf(p));opts.push(p)}}
    for(let t=0;opts.length<3&&t<300;t++){const c=normC(randPoly(R,k,k,k));if(!seen.has(keyOf(c))){seen.add(keyOf(c));opts.push(c)}}
    const sh=R.shuf(opts.map((c,i)=>({c,ok:i===0})));return{W,H,hole,c:R.pick(['#7DB9FF','#FFB86B','#8EDB9B','#C3A9FF']),opts:sh.map(x=>x.c),ans:sh.findIndex(x=>x.ok),st:{sel:null}}},
  view(it,rev){const g=gridCells(it.W,it.H,(x,y)=>has(it.hole,x,y)?{fill:'#fff',dash:1,stroke:'#FF5A5F',txt:'?',tc:'#FF5A5F'}:{fill:it.c},34);
    return`<div class="stage">${g}</div><div class="opts">${it.opts.map((cs,i)=>`<button class="opt ${optCls(it.st.sel,i,it.ans,rev)}" data-act="tap" data-v="${i}">${polyView(cs,24,it.c)}</button>`).join('')}</div>`},...selT,
  exp:()=>'조각을 돌리지 않고 그대로 빈 곳에 놓았을 때 꼭 맞는 것이 정답이에요.'}}
T.fill3=makeFill('2주 · 잘린 조각 잇기',3,'빈 곳에 꼭 맞는 조각을 찾아요.');

T.holes={cat:'3주 · 구멍 종이 겹치기',say:'두 종이를 겹쳤을 때, 두 종이 모두 구멍이 뚫린 칸에 동그라미를 해요.',q:'두 종이를 겹치면 구멍이 뚫린 칸은 어디일까요? ○를 눌러요',
  gen(R,l){const n=l===1?2:3,all=Array.from({length:n*n},(_,i)=>i);let A,B,I;do{A=all.filter(()=>R.r()<.6);B=all.filter(()=>R.r()<.6);I=A.filter(x=>B.includes(x))}while(!I.length||I.length===n*n||A.length===n*n||B.length===n*n);return{n,A,B,I,st:{on:[]}}},

  const svg=document.getElementById('tgsvg'),pc=it.st.p[+g0.dataset.i];if(!svg||pc.placed)return;e.preventDefault();
  const p0=tgPt(svg,e);
  // DOM을 바꾸지 않아야 터치가 끊기지 않아요: 복제본을 맨 위에 띄워 끌고, 원본은 투명하게 둬요
  const g=g0.cloneNode(true);g.removeAttribute('class');g.style.pointerEvents='none';svg.appendChild(g);g0.style.opacity='0';
  try{g0.setPointerCapture(e.pointerId)}catch(_){}
  TD={it,pc,g,g0,svg,sx:p0[0],sy:p0[1],ox:pc.x,oy:pc.y,moved:false,id:e.pointerId}},{passive:false});
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('.pc')&&run&&view==='quiz')e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(TD)e.preventDefault()},{passive:false});
document.addEventListener('pointermove',e=>{if(!TD||e.pointerId!==TD.id)return;const p=tgPt(TD.svg,e),dx=p[0]-TD.sx,dy=p[1]-TD.sy;if(Math.hypot(dx,dy)>.3)TD.moved=true;if(!TD.moved)return;
  TD.pc.x=clampN(TD.ox+dx,.8,13.2);TD.pc.y=clampN(TD.oy+dy,.8,17.6);TD.g.setAttribute('transform',tgT(TD.pc));e.preventDefault()},{passive:false});
function tgEnd(e){if(!TD||e.pointerId!==TD.id)return;const d=TD;TD=null;tgDrop(d)}
document.addEventListener('pointerup',tgEnd);document.addEventListener('pointercancel',tgEnd);
function tgDrop(d){const it=d.it,pc=d.pc;
  if(!d.moved){if(it.step){pc.a=(pc.a+it.step)%360}partial();return}
  let near=null,hit=null;
  it.tg.forEach(t=>{if(t.taken||t.t!==pc.t||t.f!==pc.f)return;if(Math.hypot(pc.x-t.x,pc.y-t.y)<1.25){near=t;if(tgSame(pc,t)&&!hit)hit=t}});
  if(hit){hit.taken=true;pc.x=hit.x;pc.y=hit.y;pc.a=hit.a;pc.placed=true;it.st.n++;if(it.st.n===it.tg.length){it.st.done=true;chime()}partial();return}
  const arr=it.st.p;arr.splice(arr.indexOf(pc),1);arr.push(pc);partial();
  const m=document.getElementById('tgmsg');if(m&&near)m.textContent=it.step?'거의 맞았어요! 조각을 톡 눌러서 돌려 보세요 🔄':'조금만 더 옮겨 보세요!'}
const qOf=it=>{const t=T[it.type];return typeof t.q==='function'?t.q(it):t.q};
const sayOf=it=>T[it.type].say||qOf(it);

 K1:{weeks:['1주 같은 모양','2주 □△○ 알기','3주 색종이 겹치기','4주 개수 세기'],days:[['same'],['copy'],['copy','same'],['same','copy'],['same','copy'],

 K2:{weeks:['1주 입체 모양 알기','2주 선 잇기·분류','3주 쌓기나무','4주 새가 보는 모양'],days:[['sSame'],['sSort'],['sPick'],['sOdd'],['sBuild','sSame','sSort'],

 K3:{weeks:['1주 거울 색칠','2주 잘린 조각 잇기','3주 구멍 종이 겹치기','4주 투명 종이 겹치기'],days:[['mirror'],['mirror'],['mirror'],['mirror'],['mirror'],
  ['fill3'],['fill3'],['fill3'],['fill3'],['fill3','mirror'],

  ['overlay'],['overlay'],['overlay'],['overlay'],['overlay','holes','mirror']]},
 K4:{weeks:['1주 칸 세어 넓이','2주 도미노·트리미노','3주 테트로미노','4주 패턴블록'],days:[['area'],['area'],['areaCmp'],['area','areaCmp'],['areaCmp','area'],
  ['tileCount'],['cantTile'],['tileCount','cantTile'],['cantTile','tileCount'],['tileCount','cantTile','area'],

function mk(type,seed,l){const it=T[type].gen(RR(mkRng(seed)),l);it.type=type;return it}
function spread(items,R){ // 같은 유형이 연달아 나오지 않게 섞기
  let a=R.shuf(items);
  for(let t=0;t<50;t++){let bad=-1;for(let i=1;i<a.length;i++)if(a[i].type===a[i-1].type){bad=i;break}
    if(bad<0)break;const j=a.findIndex((x,k)=>k>bad&&x.type!==a[bad-1].type&&(k+1>=a.length||x.type!==a[k+1].type));
    if(j<0){a=R.shuf(a);continue}[a[bad],a[j]]=[a[j],a[bad]]}
  return a;
}
function buildDay(p,k,dayNo){
  const days=LV[k].days,all=[...new Set(days.flat())],base=p.name+k+dayNo+Date.now(),R=RR(mkRng(hashStr(base+'x'))),items=[];
  let l,pool;
  if(dayNo==='mix'){l=2;pool=all}else{const di=dayNo%5;l=di<2?1:di<4?2:3;pool=days[dayNo]}
  const known=dayNo==='mix'?all:[...new Set(days.slice(0,dayNo+1).flat())];
  const types=[];
  // 오늘 유형 4개 + 다른 유형 4개를 섞어요
  if(dayNo==='mix'){const sh=R.shuf(all);for(let i=0;i<8;i++)types.push(sh[i%sh.length])}
  else{
    for(let i=0;i<4;i++)types.push(pool[i%pool.length]);
    let others=R.shuf(known.filter(t=>!pool.includes(t)));
    if(others.length<4)others=others.concat(R.shuf(all.filter(t=>!pool.includes(t)&&!others.includes(t))));
    if(!others.length)others=R.shuf(pool);
    for(let i=0;i<4;i++)types.push(others[i%others.length]);
  }
  types.forEach((t,i)=>items.push(mk(t,hashStr(base+i),i<4&&dayNo!=='mix'?l:Math.min(l,2))));
  const out=spread(items,R),kl=Math.min(3,(dayNo==='mix'?2:l)+(k>='K3'?1:0));out.splice(Math.min(4,out.length),0,mk('tangram',hashStr(base+'tg'),kl));return out;
}

function fbURI(seed){const h=hashStr(seed),hue=h%360,r=mkRng(h);const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="hsl(${hue},80%,88%)"/><circle cx="50" cy="52" r="32" fill="hsl(${(hue+40)%360},85%,65%)" stroke="#1D2B53" stroke-width="4"/><circle cx="38" cy="46" r="5" fill="#1D2B53"/><circle cx="62" cy="46" r="5" fill="#1D2B53"/><path d="M38 62 Q50 ${72+Math.floor(r()*6)} 62 62" stroke="#1D2B53" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;return'data:image/svg+xml;utf8,'+encodeURIComponent(svg)}
function imgFail(el){el.onerror=null;el.src=fbURI(el.dataset.seed)}
const cardImg=c=>`<img src="${cardURL(c)}" data-seed="${esc(c.seed)}" alt="${esc(c.seed)}" onerror="imgFail(this)">`;
function drawCard(p,score){
  const rare=Math.random()<(score===100?.2:.05),style=rare?'pixel-art':'thumbs';
  const owned=new Set(p.cards.map(c=>c.seed+c.style)),fresh=CARDS.filter(n=>!owned.has(n+style)),pool=fresh.length?fresh:CARDS;
  const c={seed:pool[Math.floor(Math.random()*pool.length)],style,rare,date:today()};p.cards.push(c);return c;
}

 next(){if(T[run.items[run.i].type].mini)run.res[run.i]='mini';if(run.i+1<run.items.length){run.i++;run.phase='ask';render()}else{finish()}},
 say(){speak(sayOf(run.items[run.i]))},
 quit(){if(confirm('그만할까요?')){run=null;view='hub';render()}},
 flipcard(){const f=document.getElementById('fl');if(!f||f.dataset.d)return;f.dataset.d=1;f.classList.add('spin');
  setTimeout(()=>{f.classList.remove('spin');f.classList.add('on');document.getElementById('au').classList.add('on');sparkle(document.getElementById('rv'));chime();const b=document.getElementById('rb');b.style.display='flex'},1900)},
 gate(){const a=2+Math.floor(Math.random()*8),b=3+Math.floor(Math.random()*7);const r=prompt(`부모님 확인: ${a} × ${b} = ?`);if(r!==null&&+r===a*b){view='parent';render()}},
 sd(d,el){P().start=+el.value;save()},
 tts(){DB.tts=!DB.tts;save();render()},
 lay(){DB.lay=DB.lay==='mobile'?'tablet':'mobile';save();render()},
 rtoday(){if(confirm('점수 기록을 지울까요?')){P().best={};save();render()}},
 delp(){if(confirm('정말 삭제할까요? 카드도 모두 사라져요.')){delete DB.profiles[DB.cur];DB.cur=null;save();view='home';render()}}
};
function finish(){const p=P(),ok=run.res.filter(x=>x===true).length,tot=run.items.filter(i=>!T[i.type].mini).length,sc=tot?Math.round(ok/tot*100):100,key=run.k+'-'+run.dayNo;p.best=p.best||{};
  p.best[key]=Math.max(p.best[key]||0,sc);lastCard=drawCard(p,sc);save();view='result';render();
  document.getElementById('bk').innerHTML=cardImg(lastCard)+`<div class="jua">${esc(lastCard.seed)}${lastCard.rare?' ✨희귀!':''}</div>`}
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset,el)});
document.getElementById('laysw').onclick=()=>{DB.lay=DB.lay==='mobile'?'tablet':'mobile';save();render()};
if(DB.cur&&!DB.profiles[DB.cur])DB.cur=null;
render();
</script>
